<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GitHub Pages 部署验证 · WorkBuddy</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--accent:#6366f1;--accent2:#ec4899;--text:#e2e8f0}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh;display:grid;place-items:center;background:radial-gradient(1200px 600px at 20% 10%,#312e81,transparent),var(--bg);color:var(--text);padding:24px}
  .card{background:var(--card);border:1px solid #334155;border-radius:20px;padding:40px;max-width:560px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.4);text-align:center}
  .badge{display:inline-flex;gap:8px;align-items:center;background:rgba(99,102,241,.15);color:#a5b4fc;border:1px solid #4f46e5;border-radius:999px;padding:6px 14px;font-size:13px;margin-bottom:20px}
  h1{font-size:30px;line-height:1.3;margin-bottom:12px}
  .grad{background:linear-gradient(90deg,var(--accent),var(--accent2));-webkit-background-clip:text;background-clip:text;color:transparent}
  p{color:#94a3b8;line-height:1.7;margin-bottom:24px}
  .meta{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;font-size:13px;color:#64748b}
  .meta b{color:#cbd5e1;font-weight:600}
  .pulse{width:10px;height:10px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 0 rgba(34,197,94,.7);animation:p 1.8s infinite}
  @keyframes p{0%{box-shadow:0 0 0 0 rgba(34,197,94,.7)}70%{box-shadow:0 0 0 12px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
</style>
</head>
<body>
  <div class="card">
    <div class="badge"><span class="pulse"></span> 部署成功</div>
    <h1>🎉 这个页面由 <span class="grad">WorkBuddy</span> 发布</h1>
    <p>它运行在你的 GitHub 仓库 <b>1986772315h-ui/base_work</b> 上，通过 <b>GitHub Pages</b> 对外提供服务。任何人都能通过这个链接访问——它真正属于你。</p>
    <div class="meta">
      <span>仓库：<b>base_work</b></span>
      <span>分支：<b>main</b></span>
      <span>托管：<b>GitHub Pages</b></span>
    </div>
  </div>
</body>
</html>
